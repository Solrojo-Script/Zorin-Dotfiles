include current-theme.conf

#FONT
font_size 14.8
font_family auto

#BACKGROUND
background_opacity 0.88

# CURSOR
shell_integration no-cursor
cursor_blink_interval -1
cursor_shape underline
cursor_trail 20

# BELL
enable_audio_bell no
visual_bell_duration 0.3
window_alert_on_bell yes
map ctrl+shift+T new_tab
map ctrl+shift+W close_tab
window_padding_width 10

# PORTAPAPELES Y RATON
copy_on_select clipboard
mouse_map right press ungrabbed paste_from_clipboard

# URL
detect_urls yes
url_style curly
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
show_hyperlink_targets yes
underline_hyperlinks hover
mouse_map left click ungrabbed mouse_handle_click link

#KEYBOARD SHORTCUTS
#Fullscreen F11
map f11 toggle_fullscreen

# Cambiar de pestana con Ctrl+tecla numerica en teclado AZERTY
map ctrl+& goto_tab 1
map ctrl+é goto_tab 2
map ctrl+" goto_tab 3
map ctrl+' goto_tab 4
map ctrl+( goto_tab 5
map ctrl+- goto_tab 6
map ctrl+è goto_tab 7
map ctrl+_ goto_tab 8
map ctrl+ç goto_tab 9

# BEGIN_KITTY_THEME
# Adwaita dark
include current-theme.conf
# END_KITTY_THEME

# Hide the native title bar; Forge draws the focus border.
hide_window_decorations yes
